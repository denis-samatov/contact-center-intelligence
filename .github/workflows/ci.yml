name: CI
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
env: {MLFLOW_DISABLE_AGENT_HINT: "1"}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - name: Unit + API + queue tests (no models, no LLM)
        run: pytest -q --ignore=tests/test_airflow_dag.py
  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'apache-airflow==3.3.2' -e '.[dev]'
      - name: Nightly DAG end to end (dag.test)
        run: pytest -q tests/test_airflow_dag.py
  speech-models:
    # Downloads ~1 GB of ONNX models; runs a 5-call ASR/diarization smoke. Manual trigger only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]' && scripts/fetch_models.sh models
      - run: |
          cci corpus --seed 20261023
          cci render --split test --condition telephony --limit 5
          cci eval-asr --split test --condition telephony --limit 5 --backends gigaam-v2 --diarization
